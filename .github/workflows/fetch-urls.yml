# 研究用：下載 tools/fetch_urls.txt 入面嘅網址，存到 fetched 分支（唔影響網站）
name: 下載參考資料

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths: [tools/fetch_urls.txt, tools/fetch_urls.py, tools/scrape_*.py]

permissions:
  contents: write

jobs:
  fetch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: sudo apt-get install -y poppler-utils
      - run: pip install requests beautifulsoup4
      - run: python tools/fetch_urls.py
      - name: 執行抓取程式（如有）
        run: for s in tools/scrape_*.py; do [ -f "$s" ] && python "$s" || true; done
      - name: 存到 fetched 分支
        run: |
          git config user.name "vhiswiki-bot"
          git config user.email "vhiswiki-bot@users.noreply.github.com"
          mv fetched /tmp/fetched
          git checkout --orphan fetched-new
          git rm -rq --cached . && git clean -fdq -e .git
          mv /tmp/fetched ./fetched
          git add fetched
          git commit -qm "參考資料 $(date -u +%Y-%m-%dT%H:%M)"
          git push -f origin fetched-new:fetched
